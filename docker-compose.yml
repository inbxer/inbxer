services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: inbxer:latest
    container_name: inbxer-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${REVERB_PORT:-8081}:8081"
    volumes:
      - inbxer-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inbxer

  mysql:
    image: mysql:8.4
    container_name: inbxer-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-inbxer}
      MYSQL_USER: ${DB_USERNAME:-inbxer}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-too}
    volumes:
      - inbxer-mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-change-me-too}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - inbxer

  redis:
    image: redis:7-alpine
    container_name: inbxer-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - inbxer-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - inbxer

networks:
  inbxer:
    driver: bridge

volumes:
  inbxer-storage:
  inbxer-mysql:
  inbxer-redis:
