[www]
user = inbxer
group = inbxer

listen = 127.0.0.1:9000
listen.owner = inbxer
listen.group = inbxer

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no

clear_env = no
